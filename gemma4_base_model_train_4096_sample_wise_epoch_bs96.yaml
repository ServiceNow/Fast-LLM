# Epoch-based variant: 3 epochs, 96 packed sequences per optimizer update.
type: train_gpt

run:
  experiment_dir: /mnt/queue1/shruthan/fastllm_runs/gemma4_base_model_train_4096_sample_wise_epoch_bs96

model:
  type: gpt
  base_model:
    embeddings:
      vocab_parallel: false
    decoder:
      type: pattern
      blocks:
        full_attention:
          mixer:
            implementation: sdpa
          mlp:
            type: hybrid_moe
            dense:
              recompute_level: full
            routed:
              recompute_level: full
              auxiliary_loss_coefficient: 0.0
        sliding_attention:
          mixer:
            implementation: flash
          mlp:
            type: hybrid_moe
            dense:
              recompute_level: full
            routed:
              recompute_level: full
              auxiliary_loss_coefficient: 0.0
    head:
      cross_entropy_splits: 8
      losses:
        cross_entropy:
          type: label
          reduction: sample
  multi_stage:
    zero_stage: 3
    debug_activation_memory: true
  distributed:
    tensor_parallel: 2
    sequence_tensor_parallel: true
    sequence_data_parallel: 4
    compute_dtype: bfloat16

pretrained:
  format: gemma4
  model_weights: true
  path: /mnt/core_llm_large/shruthan/models/gemma-4-26B-A4B-causal-lm
  load_config: model

training:
  evaluators: {}
  logs:
    interval: 1
  export:
    format: fast_llm
    every_epochs: 1
  epochs: 3
  global_batch_size: 96
  checkpoint:
    every_epochs: 1  # Set 0.5 or 0.25 for half/quarter-epoch checkpoints.
    keep: 1
  num_workers: 0

data:
  micro_batch_size: 4096
  maximum_document_length: 4096
  truncate_documents: false
  datasets:
    training:
      type: epoch
      datasets:
        - type: file
          path: /mnt/core_llm_large/shruthan/scripts/gemma_experiments/train_raw_fllm_stratified_50k_fastllm_memmap/fast_llm_config.yaml

# profiling:
#   memory: true
#   memory_max_entries: 2000000
#   memory_snapshot_on_oom: true
#   memory_summary_on_oom: true

optimizer:
  learning_rate:
    base: 1.0e-05
    decay_style: constant
    warmup_epochs: 0.0
  weight_decay: 0.0
